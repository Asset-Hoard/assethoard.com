<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="t d">
  <title id="t">One roadmap, two kinds of feature</title>
  <desc id="d">A roadmap from prototype to launch with two columns side by side. Prototype: core mechanics and art style for the game, devlogs and Discord for the product. Production: levels and sound design, store page and capsule art. Polish: save system and UI, wishlist funnel, press list and demo. Launch: bug fixing, trailer, festivals and streamers.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 24px; font-weight: 600; fill: #f5f5f7; }
    .phase { font-size: 17px; font-weight: 600; fill: #a1a1aa; }
    .laneA { font-size: 20px; font-weight: 700; fill: #fbbf24; }
    .laneB { font-size: 20px; font-weight: 700; fill: #c084fc; }
    .chip { font-size: 17px; font-weight: 500; fill: #f5f5f7; }
    .foot { font-size: 17px; fill: #a1a1aa; }
  </style>
  <rect x="1" y="1" width="718" height="698" rx="14" fill="#111118" stroke="#27272a" stroke-width="2"/>
  <text class="title" x="32" y="50">One roadmap, two kinds of feature</text>

  <!-- lane columns -->
  <rect x="150" y="82" width="265" height="551" rx="12" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="425" y="82" width="265" height="551" rx="12" fill="#a855f7" fill-opacity="0.06" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>
  <text class="laneA" x="282" y="114" text-anchor="middle">Game</text>
  <text class="laneB" x="557" y="114" text-anchor="middle">Product</text>

  <!-- phase dividers -->
  <g stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="32" y1="235" x2="690" y2="235"/>
    <line x1="32" y1="335" x2="690" y2="335"/>
    <line x1="32" y1="479" x2="690" y2="479"/>
  </g>
  <g class="phase">
    <text x="36" y="191">Prototype</text>
    <text x="36" y="291">Production</text>
    <text x="36" y="413">Polish</text>
    <text x="36" y="557">Launch</text>
  </g>

  <!-- game chips -->
  <g fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5">
    <rect x="162" y="145" width="241" height="36" rx="8"/>
    <rect x="162" y="189" width="241" height="36" rx="8"/>
    <rect x="162" y="245" width="241" height="36" rx="8"/>
    <rect x="162" y="289" width="241" height="36" rx="8"/>
    <rect x="162" y="345" width="241" height="36" rx="8"/>
    <rect x="162" y="389" width="241" height="36" rx="8"/>
    <rect x="162" y="489" width="241" height="36" rx="8"/>
  </g>
  <g class="chip" text-anchor="middle">
    <text x="282" y="169">Core mechanics</text>
    <text x="282" y="213">Art style</text>
    <text x="282" y="269">Levels</text>
    <text x="282" y="313">Sound design</text>
    <text x="282" y="369">Save system</text>
    <text x="282" y="413">UI</text>
    <text x="282" y="513">Bug fixing</text>
  </g>

  <!-- product chips -->
  <g fill="#a855f7" fill-opacity="0.22" stroke="#a855f7" stroke-width="1.5">
    <rect x="437" y="145" width="241" height="36" rx="8"/>
    <rect x="437" y="189" width="241" height="36" rx="8"/>
    <rect x="437" y="245" width="241" height="36" rx="8"/>
    <rect x="437" y="289" width="241" height="36" rx="8"/>
    <rect x="437" y="345" width="241" height="36" rx="8"/>
    <rect x="437" y="389" width="241" height="36" rx="8"/>
    <rect x="437" y="433" width="241" height="36" rx="8"/>
    <rect x="437" y="489" width="241" height="36" rx="8"/>
    <rect x="437" y="533" width="241" height="36" rx="8"/>
    <rect x="437" y="577" width="241" height="36" rx="8"/>
  </g>
  <g class="chip" text-anchor="middle">
    <text x="557" y="169">Devlogs</text>
    <text x="557" y="213">Discord</text>
    <text x="557" y="269">Store page</text>
    <text x="557" y="313">Capsule art</text>
    <text x="557" y="369">Wishlist funnel</text>
    <text x="557" y="413">Press list</text>
    <text x="557" y="457">Demo</text>
    <text x="557" y="513">Trailer</text>
    <text x="557" y="557">Festivals</text>
    <text x="557" y="601">Streamers</text>
  </g>

  <text class="foot" x="360" y="672" text-anchor="middle">Same roadmap, same weight. Not after the game is done.</text>
</svg>
