<svg width="270" height="200" viewBox="0 0 270 200" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes cell-in {
    0%   { opacity: 0; transform: scale(0.3); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse-border {
    0%,100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  .g1  { opacity: 0; transform-origin:  60px  37px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.05s forwards; }
  .g2  { opacity: 0; transform-origin: 110px  37px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.15s forwards; }
  .g3  { opacity: 0; transform-origin: 160px  37px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.25s forwards; }
  .g4  { opacity: 0; transform-origin: 210px  37px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.35s forwards; }
  .g5  { opacity: 0; transform-origin:  60px  79px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.45s forwards; }
  .g6  { opacity: 0; transform-origin: 110px  79px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.55s forwards; }
  .g7  { opacity: 0; transform-origin: 160px  79px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.65s forwards; }
  .g8  { opacity: 0; transform-origin: 210px  79px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.75s forwards; }
  .g9  { opacity: 0; transform-origin:  60px 121px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.85s forwards; }
  .g10 { opacity: 0; transform-origin: 110px 121px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 0.95s forwards; }
  .g11 { opacity: 0; transform-origin: 160px 121px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.05s forwards; }
  .g12 { opacity: 0; transform-origin: 210px 121px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.15s forwards; }
  .g13 { opacity: 0; transform-origin:  60px 163px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.25s forwards; }
  .g14 { opacity: 0; transform-origin: 110px 163px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.35s forwards; }
  .g15 { opacity: 0; transform-origin: 160px 163px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.45s forwards; }
  .g16 { opacity: 0; transform-origin: 210px 163px; animation: cell-in 0.25s cubic-bezier(0.34,1.5,0.64,1) 1.55s forwards; }

  .pulse { animation: pulse-border 2s ease-in-out 1.4s infinite; }
</style>

  <rect x="0" y="0" width="270" height="200" rx="12" fill="#13131a"/>

