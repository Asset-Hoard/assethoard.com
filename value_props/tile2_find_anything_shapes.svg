<svg width="270" height="200" viewBox="0 0 270 200" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes draw-line {
    0%   { stroke-dashoffset: 220; opacity: 0; }
    5%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  @keyframes dot-pop {
    0%   { opacity: 0; r: 0; }
    100% { opacity: 1; r: 4; }
  }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(0.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes ring-expand {
    0%   { r: 10; opacity: 0.9; stroke-width: 1.5; }
    100% { r: 55; opacity: 0;   stroke-width: 0.3; }
  }

  .l1 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.1s forwards; }
  .l2 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.2s forwards; }
  .l3 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.3s forwards; }
  .l4 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.4s forwards; }
  .l5 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.5s forwards; }
  .l6 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.6s forwards; }
  .l7 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.7s forwards; }
  .l8 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-line 0.7s ease 0.8s forwards; }

  .d1 { animation: dot-pop 0.3s ease 0.5s both; }
  .d2 { animation: dot-pop 0.3s ease 0.6s both; }
  .d3 { animation: dot-pop 0.3s ease 0.7s both; }
  .d4 { animation: dot-pop 0.3s ease 0.8s both; }
  .d5 { animation: dot-pop 0.3s ease 0.9s both; }
  .d6 { animation: dot-pop 0.3s ease 1.0s both; }
  .d7 { animation: dot-pop 0.3s ease 1.1s both; }
  .d8 { animation: dot-pop 0.3s ease 1.2s both; }

  .glass  { opacity: 0; transform-origin: 135px 100px; animation: pop 0.5s cubic-bezier(0.34,1.5,0.64,1) 1.2s forwards; }
  .ripple { animation: ring-expand 1.8s ease-out 1.8s infinite; }
</style>

  <rect x="0" y="0" width="270" height="200" rx="12" fill="#13131a"/>

  <line class="l1" x1="15"  y1="15"  x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l2" x1="135" y1="10"  x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l3" x1="255" y1="15"  x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l4" x1="255" y1="100" x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l5" x1="255" y1="185" x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l6" x1="135" y1="190" x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l7" x1="15"  y1="185" x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>
  <line class="l8" x1="15"  y1="100" x2="135" y2="100" stroke="#2a2a35" stroke-width="0.75"/>

  <circle class="d1" cx="15"  cy="15"  r="4" fill="#fbbf24" opacity="0.6"/>
  <circle class="d2" cx="135" cy="10"  r="4" fill="#a78bfa" opacity="0.6"/>
  <circle class="d3" cx="255" cy="15"  r="4" fill="#34d399" opacity="0.6"/>
  <circle class="d4" cx="255" cy="100" r="4" fill="#60a5fa" opacity="0.6"/>
  <circle class="d5" cx="255" cy="185" r="4" fill="#f97316" opacity="0.6"/>
  <circle class="d6" cx="135" cy="190" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle class="d7" cx="15"  cy="185" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle class="d8" cx="15"  cy="100" r="4" fill="#34d399" opacity="0.6"/>

  <circle class="ripple" cx="135" cy="100" r="10" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <g class="glass">
    <circle cx="135" cy="100" r="22" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
    <circle cx="135" cy="100" r="22" fill="#fbbf24" opacity="0.05"/>
    <line x1="151" y1="116" x2="163" y2="128" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
