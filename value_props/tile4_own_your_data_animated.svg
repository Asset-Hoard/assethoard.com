<svg width="270" height="200" viewBox="0 0 270 200" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes fade-in { from{opacity:0} to{opacity:1} }
  @keyframes shield-in {
    0%   { opacity:0; transform:scale(0.4); }
    70%  { transform:scale(1.06); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes lock-drop {
    0%   { opacity:0; transform:translateY(-12px); }
    100% { opacity:1; transform:translateY(0); }
  }
  @keyframes orbit-cw {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }
  @keyframes strike-draw {
    0%   { stroke-dashoffset:70; opacity:0; }
    20%  { opacity:1; }
    100% { stroke-dashoffset:0; opacity:1; }
  }

  .ring   { opacity:0; animation:fade-in 0.5s ease 0.1s forwards; }
  .shield { opacity:0; transform-origin:135px 100px; animation:shield-in 0.6s cubic-bezier(0.34,1.4,0.64,1) 0.5s forwards; }
  .lock   { opacity:0; animation:lock-drop 0.4s cubic-bezier(0.34,1.3,0.64,1) 1.1s forwards; }

  .o1 { transform-origin:135px 100px; animation:orbit-cw 10s linear 1.4s infinite; }
  .o2 { transform-origin:135px 100px; animation:orbit-cw 10s linear calc(1.4s - 3.33s) infinite; }
  .o3 { transform-origin:135px 100px; animation:orbit-cw 10s linear calc(1.4s - 6.67s) infinite; }

  .cloud  { opacity:0; animation:fade-in 0.4s ease 1.8s forwards; }
  .strike { stroke-dasharray:70; stroke-dashoffset:70; opacity:0; animation:strike-draw 0.5s ease 2.1s forwards; }
</style>

  <rect x="0" y="0" width="270" height="200" rx="12" fill="#13131a"/>

  <g class="ring">
    <circle cx="135" cy="100" r="80" fill="none" stroke="#2a2a35" stroke-width="1"/>
  </g>

  <g class="shield">
    <path d="M135,50 L177,68 L177,102 Q177,130 135,150 Q93,130 93,102 L93,68 Z"
      fill="#fbbf24" opacity="0.08" stroke="#fbbf24" stroke-width="1.2"/>
    <path d="M135,60 L167,75 L167,100 Q167,124 135,140 Q103,124 103,100 L103,75 Z"
      fill="#fbbf24" opacity="0.05"/>
  </g>

  <g class="lock">
    <rect x="123" y="93" width="24" height="20" rx="4" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="1.2"/>
    <path d="M127,93 L127,85 Q135,73 143,85 L143,93" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="135" cy="103" r="3" fill="#fbbf24" opacity="0.9"/>
  </g>

  <g class="o1">
    <rect x="131" y="6" width="8" height="8" rx="2" fill="#fbbf24" opacity="0.9"/>
  </g>
  <g class="o2">
    <circle cx="135" cy="10" r="4" fill="#a78bfa" opacity="0.8"/>
  </g>
  <g class="o3">
    <polygon points="135,6 140,16 130,16" fill="#34d399" opacity="0.8"/>
  </g>

</svg>
